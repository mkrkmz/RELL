name: Test

on:
  # Also on push: work lands on main directly, so a PR-only trigger meant
  # the tests first ran at release-tag time (v1.36 and v1.38 both failed there).
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Run Tests
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project "Reader for Language Learner/Reader for Language Learner.xcodeproj" \
            -scheme "Reader for Language Learner" \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            -only-testing:"Reader for Language LearnerTests" \
            -skip-testing:"Reader for Language LearnerUITests" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color

      # A test host that crashes leaves its backtrace only in the runner's
      # crash reports; print them so the log says where (v15 S1).
      - name: Print Crash Reports
        if: failure()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/Reader*; do
            [ -e "$f" ] || continue
            echo "::group::$f"; head -c 60000 "$f"; echo "::endgroup::"
          done

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
